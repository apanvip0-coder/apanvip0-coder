<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko ApanSTR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.72);--text:#111;--muted:#777;--line:rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(135deg,#f8f8f8,#dfe3e8,#fff);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.7);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}
.nav{max-width:1150px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:40px;height:40px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}
nav button,.cart-btn{border:0;background:#111;color:#fff;border-radius:13px;padding:11px 15px;font-weight:700;cursor:pointer}
.hero{max-width:1150px;margin:28px auto;padding:20px}
.hero-box{border-radius:30px;padding:55px 35px;background:linear-gradient(120deg,rgba(0,0,0,.95),rgba(55,55,55,.8));color:#fff;box-shadow:0 25px 60px rgba(0,0,0,.18)}
.hero h1{font-size:clamp(36px,6vw,65px);letter-spacing:-3px;margin-bottom:12px}.hero p{color:#ddd;max-width:600px;line-height:1.6}
.wrap{max-width:1150px;margin:auto;padding:0 20px 50px}
.tools{display:flex;gap:10px;margin:10px 0 25px;flex-wrap:wrap}
input,select,textarea{border:1px solid var(--line);background:rgba(255,255,255,.75);padding:13px 14px;border-radius:13px;outline:none;font:inherit}
.search{flex:1;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.08)}
.photo{height:210px;background:linear-gradient(135deg,#eee,#ccc);display:grid;place-items:center;color:#888;font-weight:700;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:16px}.info h3{font-size:17px;margin-bottom:7px}.price{font-weight:800;font-size:18px;margin-bottom:12px}.muted{color:var(--muted);font-size:13px}
.add{width:100%;border:0;background:#111;color:#fff;padding:12px;border-radius:12px;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:50px;color:#777;grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}.box{background:rgba(255,255,255,.92);width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:25px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.box h2{margin-bottom:18px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;cursor:pointer}
.cart-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.cart-row button{border:0;background:#eee;padding:6px 9px;border-radius:8px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:19px;padding:18px 0}
.form{display:grid;gap:10px}.form textarea{min-height:90px;resize:vertical}
.primary{border:0;background:#111;color:#fff;border-radius:13px;padding:14px;font-weight:800;cursor:pointer}
footer{text-align:center;color:#777;padding:25px}
@media(max-width:600px){.hero{padding:15px}.hero-box{padding:40px 25px}.nav{padding:12px 15px}.logo{width:36px;height:36px}.brand{font-size:17px}}
</style>
</head>
<body>
<header><div class="nav">
<div class="brand"><div class="logo" id="logoPreview">A</div><span id="storeName">Toko ApanSTR</span></div>
<div style="display:flex;gap:8px;align-items:center">
<button class="cart-btn" style="background:#eee;color:#111" onclick="openAdmin()">⚙️ Kelola</button>
<button class="cart-btn" onclick="openCart()">🛒 Keranjang (<span id="count">0</span>)</button>
</div>
</div></header>

<section class="hero"><div class="hero-box">
<h1>Toko ApanSTR</h1><p>Temukan produk pilihan dengan pengalaman belanja simpel, modern, dan nyaman.</p>
</div></section>

<main class="wrap">
<div class="tools">
<input class="search" id="search" placeholder="Cari produk..." oninput="render()">
<select id="category" onchange="render()"><option value="">Semua kategori</option><option>Free Fire</option><option>Mobile Legends</option><option>Roblox</option><option>eFootball</option><option>Rental</option><option>Top Up</option><option>Jasa</option><option>Voucher</option><option>Digital</option><option>Aksesoris</option><option>Elektronik</option><option>Fashion</option><option>Lainnya</option></select>
</div>
<div style="display:flex;gap:8px;overflow:auto;padding-bottom:16px">
<button class="cart-btn" onclick="quickCat('')">Semua</button>
<button class="cart-btn" onclick="quickCat('Free Fire')">🔥 Free Fire</button>
<button class="cart-btn" onclick="quickCat('Mobile Legends')">⚔️ MLBB</button>
<button class="cart-btn" onclick="quickCat('Roblox')">🎮 Roblox</button>
<button class="cart-btn" onclick="quickCat('eFootball')">⚽ eFootball</button>
<button class="cart-btn" onclick="quickCat('Rental')">⏱ Rental</button>
<button class="cart-btn" onclick="quickCat('Top Up')">💥 Top Up</button>
</div>
<div class="grid" id="products"></div>
</main>
<footer>© 2026 Toko ApanSTR · Website toko online</footer>

<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeModal('cartModal')">×</button><h2>Keranjang</h2><div id="cartItems"></div><div class="total"><span>Total</span><span id="total">Rp0</span></div><button class="primary" style="width:100%" onclick="openCheckout()">Lanjut Checkout</button></div></div>


<div class="modal" id="adminModal"><div class="box">
<button class="close" onclick="closeModal('adminModal')">×</button>
<h2>⚙️ Pengaturan Pemilik</h2>
<p class="muted" style="margin-bottom:15px">Data di bawah tersimpan di browser perangkat ini. Isi nomor WhatsApp dan produk Anda.</p>
<div class="form">
<input id="adminStoreName" placeholder="Nama toko">
<input id="adminWA" placeholder="Nomor WhatsApp, contoh 6281234567890">
<input id="adminLogo" placeholder="URL logo (opsional)">
<hr style="border:0;border-top:1px solid var(--line);width:100%">
<input id="prodName" placeholder="Nama produk">
<textarea id="prodDesc" placeholder="Teks/deskripsi produk"></textarea>
<input id="prodPrice" type="number" placeholder="Harga, contoh 50000">
<select id="prodCat">
<option>Free Fire</option>
<option>Mobile Legends</option>
<option>Roblox</option>
<option>eFootball</option>
<option>Rental</option>
<option>Top Up</option>
<option>Jasa</option>
<option>Voucher</option>
<option>Digital</option>
<option>Aksesoris</option>
<option>Elektronik</option>
<option>Fashion</option>
<option>Lainnya</option>
</select>
<input id="prodImage" placeholder="URL gambar produk (opsional)">
<button class="primary" onclick="saveProduct()">➕ Tambah Produk</button>
<div id="adminProducts"></div>
<button class="primary" style="background:#eee;color:#111" onclick="saveSettings()">Simpan Pengaturan</button>
</div></div></div>

<div class="modal" id="checkoutModal"><div class="box"><button class="close" onclick="closeModal('checkoutModal')">×</button><h2>Checkout / Pesan</h2>
<div class="form">
<input id="name" placeholder="Nama lengkap">
<input id="phone" placeholder="Nomor WhatsApp">
<textarea id="address" placeholder="Alamat pengiriman"></textarea>
<textarea id="note" placeholder="Catatan pesanan (opsional)"></textarea>
<button class="primary" onclick="checkout('form')">Pesan via WhatsApp</button>
<button class="primary" style="background:#eee;color:#111" onclick="checkout('copy')">Salin Detail Pesanan</button>
</div></div></div>

<script>
/* ===== AREA PEMILIK TOKO =====
   Ganti nomor WhatsApp dan isi daftar produk di bawah.
   Tempat gambar produk: isi image dengan URL gambar,
   atau kosongkan untuk menampilkan kotak "Foto Produk".
*/
const DEFAULT_PRODUCTS = [
 {id:1,name:"Free Fire N001",price:150000,category:"Free Fire",image:"",desc:"Akun Free Fire siap jual. Detail item dan kondisi dapat ditulis di deskripsi."},
 {id:2,name:"Free Fire N002",price:275000,category:"Free Fire",image:"",desc:"Akun Free Fire dengan koleksi item. Hubungi toko untuk detail lengkap."},
 {id:3,name:"Free Fire N003",price:500000,category:"Free Fire",image:"",desc:"Akun Free Fire premium. Detail stok dapat diperbarui pemilik."},
 {id:4,name:"Mobile Legends ML001",price:250000,category:"Mobile Legends",image:"",desc:"Akun Mobile Legends. Cantumkan hero, skin, rank, dan detail lainnya."},
 {id:5,name:"Mobile Legends ML002",price:650000,category:"Mobile Legends",image:"",desc:"Akun Mobile Legends siap dipasarkan dengan deskripsi lengkap."},
 {id:6,name:"Mobile Legends ML003",price:1200000,category:"Mobile Legends",image:"",desc:"Akun ML premium. Detail akun dapat ditulis oleh pemilik."},
 {id:7,name:"Roblox Account R001",price:175000,category:"Roblox",image:"",desc:"Akun Roblox untuk dijual. Detail username dan isi akun ditambahkan pemilik."},
 {id:8,name:"Roblox Account R002",price:450000,category:"Roblox",image:"",desc:"Akun Roblox dengan item/akses tertentu. Detail dapat diperbarui."},
 {id:9,name:"eFootball Account E001",price:300000,category:"eFootball",image:"",desc:"Akun eFootball siap jual. Tuliskan squad dan detail akun."},
 {id:10,name:"eFootball Account E002",price:850000,category:"eFootball",image:"",desc:"Akun eFootball premium dengan detail yang bisa disesuaikan."},
 {id:11,name:"Akun Game Rental 1",price:25000,category:"Rental",image:"",desc:"Rental akun game. Tuliskan durasi rental dan ketentuan di deskripsi."},
 {id:12,name:"Akun Game Rental 2",price:50000,category:"Rental",image:"",desc:"Rental akun game dengan pilihan durasi yang dapat diatur pemilik."},
 {id:13,name:"Top Up Free Fire",price:10000,category:"Top Up",image:"",desc:"Layanan top up Free Fire. Isi nominal yang tersedia pada deskripsi."},
 {id:14,name:"Top Up Mobile Legends",price:10000,category:"Top Up",image:"",desc:"Layanan top up Mobile Legends. Nominal dapat disesuaikan."},
 {id:15,name:"Top Up Roblox",price:20000,category:"Top Up",image:"",desc:"Layanan top up Roblox. Detail nominal dan proses dapat ditulis."},
 {id:16,name:"Jasa Joki Game",price:25000,category:"Jasa",image:"",desc:"Jasa bantuan game. Cantumkan game, layanan, dan harga pada deskripsi."},
 {id:17,name:"Voucher Game",price:20000,category:"Voucher",image:"",desc:"Voucher game digital. Detail jenis voucher dapat diperbarui."},
 {id:18,name:"Nomer / ID Digital",price:50000,category:"Digital",image:"",desc:"Produk digital. Tuliskan jenis dan ketentuan produk secara jelas."},
 {id:19,name:"Aksesoris Gaming",price:75000,category:"Aksesoris",image:"",desc:"Aksesoris gaming untuk dijual. Tambahkan foto dan spesifikasi."},
 {id:20,name:"Produk Custom 1",price:100000,category:"Lainnya",image:"",desc:"Slot produk bebas untuk kebutuhan Toko ApanSTR."}
];
let products = JSON.parse(localStorage.getItem("apan_products") || "null") || DEFAULT_PRODUCTS;
let OWNER_WA = localStorage.getItem("apan_wa") || "6281234567890";
let STORE_NAME = localStorage.getItem("apan_store") || "Toko ApanSTR";
let LOGO_URL = localStorage.getItem("apan_logo") || "";


let cart=[];
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);


function openAdmin(){
 document.getElementById("adminStoreName").value=STORE_NAME;
 document.getElementById("adminWA").value=OWNER_WA;
 document.getElementById("adminLogo").value=LOGO_URL;
 drawAdmin();
 document.getElementById("adminModal").classList.add("show");
}
function drawAdmin(){
 document.getElementById("adminProducts").innerHTML=products.map((p,i)=>`
 <div class="cart-row"><div><b>${p.name}</b><br><span class="muted">${rupiah(p.price)} · ${p.category}<br>${p.desc}</span></div>
 <button onclick="removeProduct(${p.id})">Hapus</button></div>`).join("");
}
function saveSettings(){
 STORE_NAME=document.getElementById("adminStoreName").value.trim()||"Toko ApanSTR";
 OWNER_WA=document.getElementById("adminWA").value.trim()||"6281234567890";
 LOGO_URL=document.getElementById("adminLogo").value.trim();
 localStorage.setItem("apan_store",STORE_NAME);
 localStorage.setItem("apan_wa",OWNER_WA);
 localStorage.setItem("apan_logo",LOGO_URL);
 document.getElementById("storeName").textContent=STORE_NAME;
 document.querySelector(".hero h1").textContent=STORE_NAME;
 document.getElementById("logoPreview").innerHTML=LOGO_URL?`<img src="${LOGO_URL}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:"A";
 alert("Pengaturan tersimpan.");
}
function saveProduct(){
 const name=document.getElementById("prodName").value.trim();
 const desc=document.getElementById("prodDesc").value.trim();
 const price=Number(document.getElementById("prodPrice").value);
 const category=document.getElementById("prodCat").value;
 const image=document.getElementById("prodImage").value.trim();
 if(!name||!desc||!price)return alert("Isi nama, teks/deskripsi, dan harga produk.");
 products.push({id:Date.now(),name,desc,price,category,image});
 localStorage.setItem("apan_products",JSON.stringify(products));
 ["prodName","prodDesc","prodPrice","prodImage"].forEach(id=>document.getElementById(id).value="");
 drawAdmin();render();
}
function removeProduct(id){
 products=products.filter(p=>p.id!==id);
 localStorage.setItem("apan_products",JSON.stringify(products));
 drawAdmin();render();
}
function quickCat(cat){document.getElementById("category").value=cat;render();}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const cat=document.getElementById("category").value;
 const list=products.filter(p=>(p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q))&&(!cat||p.category===cat));
 document.getElementById("products").innerHTML=list.length?list.map(p=>`
 <article class="card"><div class="photo">${p.image?`<img src="${p.image}" alt="${p.name}">`:"📷 Foto Produk"}</div>
 <div class="info"><h3>${p.name}</h3><div class="muted">${p.category}</div><div style="margin:8px 0;line-height:1.45">${p.desc}</div><div class="price">${rupiah(p.price)}</div><button class="add" onclick="add(${p.id})">Tambah ke Keranjang</button></div></article>`).join(""):`<div class="empty">Produk tidak ditemukan.</div>`;
}
function add(id){const p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...p,qty:1});update();openCart()}
function update(){document.getElementById("count").textContent=cart.reduce((a,b)=>a+b.qty,0)}
function openCart(){document.getElementById("cartModal").classList.add("show");drawCart()}
function drawCart(){document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>`<div class="cart-row"><div><b>${x.name}</b><br><span class="muted">${rupiah(x.price)} × ${x.qty}</span></div><div><button onclick="change(${x.id},-1)">−</button> <button onclick="change(${x.id},1)">+</button></div></div>`).join(""):"<div class='empty'>Keranjang masih kosong.</div>";document.getElementById("total").textContent=rupiah(cart.reduce((a,b)=>a+b.price*b.qty,0))}
function change(id,n){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);update();drawCart()}
function openCheckout(){if(!cart.length)return alert("Keranjang masih kosong.");closeModal("cartModal");document.getElementById("checkoutModal").classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function details(){return cart.map(x=>`- ${x.name} (${x.qty}x) = ${rupiah(x.price*x.qty)}`).join("\n")}
function checkout(type){
 const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),note=document.getElementById("note").value.trim();
 if(!name||!phone||!address)return alert("Mohon isi nama, nomor WhatsApp, dan alamat.");
 const total=cart.reduce((a,b)=>a+b.price*b.qty,0);
 const msg=`Halo Toko ApanSTR, saya ingin memesan:\n\n${details()}\n\nTotal: ${rupiah(total)}\n\nNama: ${name}\nNo. WhatsApp: ${phone}\nAlamat: ${address}\nCatatan: ${note||"-"}`;
 if(type==="copy"){navigator.clipboard.writeText(msg).then(()=>alert("Detail pesanan berhasil disalin."));}
 else window.open(`https://wa.me/${OWNER_WA}?text=${encodeURIComponent(msg)}`,"_blank");
}
document.getElementById("storeName").textContent=STORE_NAME;
document.querySelector(".hero h1").textContent=STORE_NAME;
document.getElementById("logoPreview").innerHTML=LOGO_URL?`<img src="${LOGO_URL}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:"A";
render();
</script>
</body></html>
